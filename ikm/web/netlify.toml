# Netlify — IT Knowledge Map v2 (deploy desde ikm/web, el sitio estatico).
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA (React Router): todas las rutas caen en index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
