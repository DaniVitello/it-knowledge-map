# Netlify — IT Knowledge Map v2 (deploy desde ikm/web, el sitio estatico).
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Health del chat (probe del frontend).
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# Proxy del chat hacia la Function (pretty URL /api/chat).
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

# SPA (React Router): todas las rutas caen en index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
