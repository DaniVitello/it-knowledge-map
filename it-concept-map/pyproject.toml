[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "it-concept-map"
version = "0.3.0"
description = "Pipeline de enriquecimiento de conceptos IT (vault Obsidian): registry, state, writer, backend, research, synthesis, validation, runner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
nlm = ["notebooklm-py>=0.8.4"]

[tool.setuptools.packages.find]
include = ["main*", "exe*", "utility*"]

[project.scripts]
kpipe = "main.cli:main"

[tool.pytest.ini_options]
testpaths = ["test"]
